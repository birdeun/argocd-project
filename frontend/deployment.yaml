apiVersion: apps/v1
kind: Deployment
metadata:
  name: senre-frontend
  namespace: frontend-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: senre-frontend
  template:
    metadata:
      labels:
        app: senre-frontend
    spec:
      containers:
        - name: senre-frontend
          image: senre/crayon-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi